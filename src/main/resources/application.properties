spring.application.name=SpringConfigServer

spring.cloud.config.server.git.uri=https://github.com/Sanjay-Krishna-N/SpringConfigServer
spring.cloud.config.server.git.default-label=master
spring.cloud.config.server.git.search-paths=config/*
#spring.cloud.config.server.git.username=yourusername
#spring.cloud.config.server.git.password=${GITHUB_TOKEN}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.force-pull=true
spring.cloud.config.server.git.refresh-rate=0

server.ssl.enabled=false
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=MyFixedPass2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=myapp
server.port=8199